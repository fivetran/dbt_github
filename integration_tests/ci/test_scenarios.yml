#   bigquery: ">=1.3.0,<2.0.0"
#   postgres: ">=1.3.0,<2.0.0"
#   redshift: ">=1.3.0,<2.0.0"
#   databricks: ">=1.6.0,<2.0.0"

schema_variable_name: "github_schema"

include_databricks_sql: false
include_sqlserver: false
include_duckdb: true
include_dbt_compile: true

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "optional features disabled"
    vars:
      github__using_repo_team: false
      github__using_issue_assignee: false
      github__using_issue_label: false
      github__using_requested_reviewer_history: false
      github__using_label: false
    include_incremental: false

  - name: "MDLS"
    vars:
      fivetran_using_source_casing: true
    include_incremental: false
    include_dbt_seed: true
